<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal Diary</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3e8ff;
}
.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}
h1{
    text-align:center;
    color:#6a0dad;
}
#date,#time{
    text-align:center;
    font-weight:bold;
}
textarea{
    width:100%;
    height:300px;
    padding:10px;
    font-size:16px;
    border-radius:8px;
}
button{
    padding:12px 25px;
    background:#6a0dad;
    color:white;
    border:none;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
}
#msg{
    color:green;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>📖 My Personal Diary</h1>

<p id="date"></p>
<p id="time"></p>

<textarea id="diary" placeholder="Write today's memories here..."></textarea>
<h1>📖 My Personal Diary</h1>

<p id="date"></p>
<p id="time"></p>

<textarea id="diary" placeholder="Write your memories here..."></textarea>

<br><br>

<button onclick="saveDiary()">💾 Save</button>

<p id="msg"></p>
<br><br>

<button onclick="saveDiary()">💾 Save</button>

<button onclick="window.location.href='home.html'">🏠 Home</button>

<p id="msg"></p>

</div>

<script>

let today=new Date().toLocaleDateString();

document.getElementById("date").innerHTML="📅 Date : "+today;

setInterval(function(){
document.getElementById("time").innerHTML=
"🕒 Time : "+new Date().toLocaleTimeString();
},1000);

document.getElementById("diary").value=
localStorage.getItem(today)||"";

function saveDiary(){
let text=document.getElementById("diary").value;
localStorage.setItem(today,text);
document.getElementById("msg").innerHTML="✅ Diary Saved Successfully!";
}

</script>

</body>
</html>
