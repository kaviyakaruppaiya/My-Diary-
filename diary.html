<!DOCTYPE html>
<html>
<head>
<title>My Diary</title>
<style>
body{
font-family:Arial,sans-serif;
background:#f3e8ff;
text-align:center;
padding:20px;
}
.box{
background:white;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
box-shadow:0 0 10px gray;
}
textarea{
width:100%;
height:250px;
font-size:16px;
}
button{
padding:10px 20px;
background:#7b2cbf;
color:white;
border:none;
border-radius:8px;
margin-top:10px;
}
</style>
</head>
<body>

<div class="box">
<h2>📖 My Personal Diary</h2>

<textarea id="diary"></textarea>
<br>

<button onclick="saveDiary()">Save</button>

<p id="msg"></p>

</div>

<script>
window.onload=function(){
document.getElementById("diary").value=
localStorage.getItem("myDiary")||"";
}

function saveDiary(){
localStorage.setItem("myDiary",
document.getElementById("diary").value);
document.getElementById("msg").innerHTML="✅ Saved Successfully!";
}
</script>

</body>
</html>
